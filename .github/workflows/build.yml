name: Build IPA
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Registra un video delle prove sul simulatore (solo su richiesta)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Genera il progetto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Prova sul simulatore (avvio, aggiornamento e prove automatiche)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulatore: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          # Prima installa la versione 1.0, così si prova anche l'aggiornamento
          # sopra i dati salvati da una versione precedente (come su un iPhone vero).
          git fetch -q --depth=1 origin 1f8fd4303b259d9e6262fb4858c7c266f48524a2
          mkdir v1 && git archive 1f8fd4303b259d9e6262fb4858c7c266f48524a2 | tar -x -C v1
          (cd v1 && xcodegen generate && xcodebuild -project Spese.xcodeproj -scheme Spese \
            -configuration Release -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath build-sim CODE_SIGN_IDENTITY="-" build -quiet)
          xcrun simctl install "$UDID" v1/build-sim/Build/Products/Release-iphonesimulator/Spese.app
          xcrun simctl launch "$UDID" com.tuonome.spese
          sleep 10
          xcrun simctl terminate "$UDID" com.tuonome.spese || true

          xcodebuild -project Spese.xcodeproj -scheme Spese \
            -configuration Release -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath build-sim CODE_SIGN_IDENTITY="-" build
          xcrun simctl install "$UDID" build-sim/Build/Products/Release-iphonesimulator/Spese.app
          PID=$(xcrun simctl launch "$UDID" com.tuonome.spese | awk '{print $NF}')
          echo "Avviata con PID $PID"
          sleep 20
          xcrun simctl io "$UDID" screenshot screenshot.png
          if ! ps -p "$PID" > /dev/null; then
            echo "::error::L'app si è chiusa da sola (crash) dopo l'avvio"
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i spese && \
              cat ~/Library/Logs/DiagnosticReports/*Spese* | head -150
            exit 1
          fi
          echo "L'app è ancora in esecuzione dopo 20 secondi: ok"

          # Prove automatiche dell'uso dell'app, partendo da un'installazione pulita.
          xcrun simctl uninstall "$UDID" com.tuonome.spese
          REC=""
          if [ "${{ inputs.video }}" = "true" ]; then
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force video-prove.mp4 &
            REC=$!
            sleep 3
          fi
          STATUS=0
          xcodebuild test -project Spese.xcodeproj -scheme Spese -destination "id=$UDID" \
            -derivedDataPath build-test CODE_SIGN_IDENTITY="-" || STATUS=$?
          if [ -n "$REC" ]; then kill -INT "$REC"; wait "$REC" || true; ls -la video-prove.mp4 || true; fi
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          # Schermata dell'app con i dati lasciati dalle prove.
          xcrun simctl launch "$UDID" com.tuonome.spese
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-simulatore
          path: screenshot.png
          if-no-files-found: ignore

      - name: Compila per iPhone (senza firma)
        run: |
          xcodebuild -project Spese.xcodeproj -scheme Spese \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Crea l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Spese.app Payload/
          zip -r Spese.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Spese-ipa
          path: Spese.ipa

      - name: Pubblica l'IPA nella Release "ultima-versione"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versione --yes --cleanup-tag || true
          cp screenshot.png schermata-simulatore.png
          FILES="Spese.ipa schermata-simulatore.png"
          if [ -f video-prove.mp4 ]; then FILES="$FILES video-prove.mp4"; fi
          gh release create ultima-versione $FILES \
            --target "$GITHUB_SHA" --latest \
            --title "Spese – build ${{ github.run_number }}" \
            --notes "Compilata da ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Testata sul simulatore. Scarica Spese.ipa e installala con Sideloadly."
