name: Spese
options:
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
targets:
  Spese:
    type: application
    platform: iOS
    sources: [Spese, Shared]
    dependencies:
      - target: SpeseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.spese   # cambia "tuonome"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Spese-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Spese.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Spese
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.12"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Sblocca le tue spese"
        INFOPLIST_KEY_NSCameraUsageDescription: "Serve per fotografare gli scontrini"
  SpeseWidget:
    type: app-extension
    platform: iOS
    sources: [SpeseWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.spese.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/SpeseWidget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Spese
        CODE_SIGN_ENTITLEMENTS: Config/SpeseWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.12"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  SpeseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpeseUITests]
    dependencies:
      - target: Spese
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.spese.uitests
        TEST_TARGET_NAME: Spese
        SWIFT_VERSION: "5.0"
  SpeseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpeseTests]
    dependencies:
      - target: Spese
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.spese.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spese.app/Spese"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
schemes:
  Spese:
    build:
      targets:
        Spese: all
        SpeseTests: [test]
        SpeseUITests: [test]
    test:
      targets: [SpeseTests, SpeseUITests]
