name: Spese
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Spese:
    type: application
    platform: iOS
    sources: [Spese]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.spese   # cambia "tuonome"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spese
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Sblocca le tue spese"
        INFOPLIST_KEY_NSCameraUsageDescription: "Serve per fotografare gli scontrini"
  SpeseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpeseUITests]
    dependencies:
      - target: Spese
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.spese.uitests
        TEST_TARGET_NAME: Spese
        SWIFT_VERSION: "5.0"
schemes:
  Spese:
    build:
      targets:
        Spese: all
        SpeseUITests: [test]
    test:
      targets: [SpeseUITests]
